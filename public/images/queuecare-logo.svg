<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none">
  <defs>
    <linearGradient id="qc-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="qc-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="qc-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0d9488" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Logo Mark Container -->
  <g transform="translate(10, 10)" filter="url(#qc-shadow)">
    <!-- Outer Rounded Hexagon / Shield Frame -->
    <rect x="0" y="0" width="70" height="70" rx="20" fill="url(#qc-gradient)"/>
    
    <!-- White Medical Cross & Dynamic Queue Flow -->
    <!-- Vertical Cross Stem with soft pill radius -->
    <rect x="29" y="15" width="12" height="40" rx="6" fill="#ffffff"/>
    
    <!-- Horizontal Cross Stem with dynamic heartbeat / fast forward queue arrows -->
    <rect x="15" y="29" width="40" height="12" rx="6" fill="#ffffff"/>
    
    <!-- Care Accent Dot / Vital Pulse Point -->
    <circle cx="48" cy="22" r="4.5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    
    <!-- Flowing queue pulse line -->
    <path d="M 22 47 Q 35 43 48 48" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>
  </g>

  <!-- Typography: QueueCare -->
  <g transform="translate(94, 20)">
    <!-- Queue in deep executive slate -->
    <text x="0" y="34" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#0f172a" letter-spacing="-0.03em">
      Queue<tspan fill="#0d9488">Care</tspan>
    </text>
    
    <!-- Tagline: Less Wait · More Care -->
    <text x="2" y="52" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#64748b" letter-spacing="0.08em">
      LESS WAIT <tspan fill="#0d9488">·</tspan> MORE CARE
    </text>
  </g>
</svg>
